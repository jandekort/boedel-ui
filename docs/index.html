<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Boedelverdeling</title>
<style>
body{font-family:Arial,sans-serif;max-width:900px;margin:20px auto;padding:0 10px}
table{width:100%;border-collapse:collapse;margin-top:10px}
th,td{border:1px solid #ccc;padding:6px 8px;font-size:14px;text-align:left}
th{background:#1F3864;color:#fff}
.tab-btn{padding:8px 16px;border:1px solid #1F3864;background:#fff;cursor:pointer}
.tab-btn.active{background:#1F3864;color:#fff}
.tab{display:none}.tab.active{display:block}
#setup{background:#F8CBAD;padding:10px;margin-bottom:10px}
#heirSel.noname{border:2px solid #C00000}
#itemTable button:disabled{opacity:.4;cursor:not-allowed}
input[type=number]{appearance:textfield;-moz-appearance:textfield}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.ok{color:green}.err{color:#C00000}
</style>
</head>
<body>
<h2>Boedelverdeling</h2>

<div id="setup">
  <label>Ik ben: <select id="heirSel"></select></label>
  <label style="margin-left:10px">Personal Access Token: <input type="password" id="patInput" size="40"></label>
  <button id="saveSetup">Opslaan</button>
  <span id="setupStatus"></span>
</div>

<div>
  <button class="tab-btn active" data-tab="bied">Biedingen</button>
  <button class="tab-btn" data-tab="log">Logboek</button>
  <button id="refreshBtn">Vernieuwen</button>
  <button id="saveLogBtn">Logboek opslaan</button>
</div>

<div id="bied" class="tab active">
  <table id="itemTable">
    <thead><tr><th>Kavel</th><th>Omschrijving</th><th>Hoogste bod</th><th>Leider</th><th>Jouw bod</th><th></th></tr></thead>
    <tbody></tbody>
  </table>
</div>

<div id="log" class="tab">
  <table id="logTable">
    <thead><tr><th>Tijdstip</th><th>Bieder</th><th>Kavel</th><th>Bod</th><th>Geldig?</th></tr></thead>
    <tbody></tbody>
  </table>
  <p><a id="historyLink" href="#" target="_blank">Bekijk commit-geschiedenis op GitHub</a></p>
</div>

<script>
const OWNER = "jandekort"; // eigenaar van boedel-data
const DATA_REPO = "boedel-data";
const BRANCH = "main";
const BID_PATH = "bids.jsonl";

let items=[], heirs=[], settings={minIncrement:5, minPercent:5}, cachedBids=[];
let pat = localStorage.getItem('pat') || '';
localStorage.removeItem('heir'); // naam wordt bewust niet onthouden

// De dropdown is de enige bron van waarheid voor de naam, live uitgelezen bij elk bod
function currentHeir(){ return document.getElementById('heirSel').value; }

async function loadConfig(){
  items = await (await fetch('items.json')).json();
  heirs = await (await fetch('heirs.json')).json();
  settings = Object.assign({minIncrement:5, minPercent:5}, await (await fetch('settings.json')).json());
  const sel = document.getElementById('heirSel');
  sel.innerHTML = '<option value="" disabled selected>Kies een naam</option>'
    + heirs.map(h=>`<option value="${h.name}">${h.name}</option>`).join('');
  sel.classList.add('noname');
  sel.onchange = updateBidButtons;
  document.getElementById('patInput').value = pat;
  if(pat) document.getElementById('setupStatus').innerHTML = '<span class="ok">Token aanwezig.</span>';
}

// Bieden kan pas als er een naam gekozen is; de rode rand verdwijnt zodra dat gebeurd is
function updateBidButtons(){
  const ok = !!currentHeir();
  document.getElementById('heirSel').classList.toggle('noname', !ok);
  document.querySelectorAll('#itemTable tbody button').forEach(b=>{
    b.disabled = !ok;
    b.title = ok ? '' : 'Kies eerst een naam';
  });
}

document.getElementById('saveSetup').onclick = ()=>{
  pat = document.getElementById('patInput').value.trim();
  localStorage.setItem('pat', pat);
  document.getElementById('setupStatus').textContent = 'Opgeslagen.';
};

document.querySelectorAll('.tab-btn[data-tab]').forEach(b=>{
  b.onclick = ()=>{
    document.querySelectorAll('.tab-btn[data-tab]').forEach(x=>x.classList.remove('active'));
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    document.getElementById(b.dataset.tab).classList.add('active');
  };
});

function b64EncodeUnicode(str){ return btoa(String.fromCharCode(...new TextEncoder().encode(str))); }
function b64DecodeUnicode(b64){
  const bin = atob(b64);
  return new TextDecoder().decode(Uint8Array.from(bin, c=>c.charCodeAt(0)));
}

async function ghGetBids(){
  const res = await fetch(`https://api.github.com/repos/${OWNER}/${DATA_REPO}/contents/${BID_PATH}?ref=${BRANCH}`,
    {headers:{Authorization:`token ${pat}`, Accept:'application/vnd.github+json'}});
  if(!res.ok) throw new Error(`GET mislukt (${res.status}): ${(await res.json()).message||''}`);
  const data = await res.json();
  const content = data.content ? b64DecodeUnicode(data.content.replace(/\n/g,'')) : '';
  return {content, sha: data.sha};
}

async function ghPutBids(content, sha, message){
  return fetch(`https://api.github.com/repos/${OWNER}/${DATA_REPO}/contents/${BID_PATH}`,{
    method:'PUT',
    headers:{Authorization:`token ${pat}`, Accept:'application/vnd.github+json'},
    body: JSON.stringify({message, content:b64EncodeUnicode(content), sha, branch:BRANCH})
  });
}

function parseBids(content){ return content.split('\n').filter(l=>l.trim()).map(l=>JSON.parse(l)); }

// Minimale ophoging: max(vast bedrag, percentage van huidig hoogste bod), naar boven afgerond op hele euro's
function requiredBid(high){
  if(high===0) return settings.minIncrement;
  return high + Math.max(settings.minIncrement, Math.ceil(high * settings.minPercent / 100));
}

// Geldig als bod >= vorig geldig hoogste + minimale ophoging (of >= minIncrement bij openingsbod)
function computeState(bids){
  const state = {};
  const withValidity = bids.map(b=>{
    const s = state[b.item] || {high:0, leader:null};
    const required = requiredBid(s.high);
    const valid = b.bid >= required;
    if(valid) state[b.item] = {high:b.bid, leader:b.heir};
    return {...b, valid, required};
  });
  return {state, withValidity};
}

async function refresh(){
  const {content} = await ghGetBids();
  cachedBids = parseBids(content);
  const {state, withValidity} = computeState(cachedBids);
  renderItems(state);
  renderLog(withValidity);
  document.getElementById('historyLink').href = `https://github.com/${OWNER}/${DATA_REPO}/commits/${BRANCH}/${BID_PATH}`;
}

function renderItems(state){
  document.querySelector('#itemTable tbody').innerHTML = items.map(it=>{
    const s = state[it.id] || {high:0, leader:''};
    return `<tr><td>${it.id}</td><td>${it.desc}</td><td>€${s.high}</td><td>${s.leader||''}</td>
      <td><input type="number" min="0" step="1" id="bid_${it.id}" placeholder="min €${requiredBid(s.high)}"></td>
      <td><button onclick="placeBid('${it.id}')">Bieden</button></td></tr>`;
  }).join('');
  updateBidButtons();
}

function renderLog(rows){
  document.querySelector('#logTable tbody').innerHTML = rows.slice().reverse().map(r=>
    `<tr class="${r.valid?'ok':'err'}"><td>${r.ts}</td><td>${r.heir}</td><td>${r.item}</td>
     <td>€${r.bid}</td><td>${r.valid?'ja':'NEE (vereist €'+r.required+')'}</td></tr>`).join('');
}

async function placeBid(itemId){
  const heir = currentHeir();
  if(!heir){ alert('Kies eerst een naam in de lijst "Ik ben".'); return; }
  if(!pat){ alert('Vul een Personal Access Token in en klik Opslaan.'); return; }
  const el = document.getElementById(`bid_${itemId}`);
  const amount = Number(el.value);
  if(!amount || amount<=0){ alert('Vul een geldig bedrag in.'); return; }

  // Bevestiging door de naam te typen (hoofdletters en spaties maken niet uit)
  const norm = s => s.toLowerCase().replace(/\s+/g,'');
  const typed = prompt(`Wil je een bod van €${amount} uitbrengen op ${itemId} voor ${heir}?\n\nTyp "${heir}" om het bod te bevestigen:`);
  if(typed === null) return;
  if(norm(typed) !== norm(heir)){ alert('Naam komt niet overeen. Bod niet geplaatst.'); return; }

  for(let attempt=0; attempt<5; attempt++){
    const {content, sha} = await ghGetBids();
    const {state} = computeState(parseBids(content));
    const s = state[itemId] || {high:0};
    const required = requiredBid(s.high);
    if(amount < required){ alert(`Bod te laag. Vereist minimaal €${required}.`); return; }

    const line = JSON.stringify({ts:new Date().toISOString(), heir, item:itemId, bid:amount});
    const newContent = content + (content && !content.endsWith('\n') ? '\n' : '') + line + '\n';
    const res = await ghPutBids(newContent, sha, `bid: ${heir} ${itemId} €${amount}`);
    if(res.ok){ await refresh(); return; }
    if(res.status===409 || res.status===422) continue; // iemand anders was sneller
    alert('Fout: '+(await res.json()).message); return;
  }
  alert('Kon bod niet plaatsen (herhaalde conflicten).');
}

document.getElementById('refreshBtn').onclick = refresh;
document.getElementById('saveLogBtn').onclick = ()=>{
  const content = cachedBids.map(b=>JSON.stringify(b)).join('\n') + (cachedBids.length ? '\n' : '');
  const blob = new Blob([content], {type:'application/x-jsonlines'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `bids-${new Date().toISOString().slice(0,10)}.jsonl`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
};

loadConfig().then(refresh).catch(e=>alert('Kon config/log niet laden: '+e.message));
</script>
</body>
</html>
